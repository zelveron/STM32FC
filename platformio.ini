; STM32F407VET6 + BMI323 (SPI1) firmware
; BMI323 wiring: PA5=SCK, PA6=MISO, PA7=MOSI, PA4=CS

[env:black_f407ve]
platform = ststm32
board = black_f407ve
framework = arduino

; Flash over the STM32 ROM bootloader (USB DFU, 0483:df11)
upload_protocol = dfu

; Enable native USB CDC so "SerialUSB" is available on the F407 USB port
build_flags =
  -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
  -D USB_MANUFACTURER=\"STM32FC\"
  -D USB_PRODUCT=\"F407_BMI323_IMU\"

monitor_speed = 115200
monitor_port = /dev/ttyACM0
